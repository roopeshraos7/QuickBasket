server:
  port: 8080

spring:
  application:
    name: quickbasket-test

  datasource:
    url: jdbc:h2:mem:quickbasketdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

  sql:
    init:
      mode: always
      defer-datasource-initialization: true

quickcommerce:
  api:
    base-url: https://quickcommerceapi.com
    key: test-key
    active-provider: mock
