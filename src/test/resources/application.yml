spring:
  application:
    name: quickbasket-test
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:quickbasketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379

quickcommerce:
  api:
    base-url: http://localhost:8089
    token: test-token
    active-provider: all

quickbasket:
  cache:
    ttl-seconds: 300
  providers:
    mock:
      enabled: true
      timeout-ms: 1500
    quickcommerce-api:
      enabled: false
      timeout-ms: 1500
