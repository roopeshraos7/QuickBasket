spring:
  application:
    name: quickbasket
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/quickbasket
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

quickcommerce:
  api:
    base-url: https://api.quickcommerceapi.com
    token: mock-bearer-token-12345
    active-provider: all

quickbasket:
  cache:
    ttl-seconds: 300
  providers:
    mock:
      enabled: true
      timeout-ms: 1500
    quickcommerce-api:
      enabled: false
      timeout-ms: 1500
    flipkart:
      enabled: false
      affiliate-id: ${FLIPKART_AFFILIATE_ID:}
      affiliate-token: ${FLIPKART_AFFILIATE_TOKEN:}
      base-url: https://affiliate-api.flipkart.net
      timeout-ms: 2000
      result-count: 10
    amazon:
      enabled: false
      client-id: ${AMAZON_CLIENT_ID:}
      client-secret: ${AMAZON_CLIENT_SECRET:}
      partner-tag: ${AMAZON_PARTNER_TAG:}
      marketplace: ${AMAZON_MARKETPLACE:www.amazon.in}
      base-url: https://creatorsapi.amazon
      token-url: ${AMAZON_TOKEN_URL:https://api.amazon.co.in/auth/o2/token}
      timeout-ms: 1500
      item-count: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
