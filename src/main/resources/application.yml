server:
  port: 8080

spring:
  application:
    name: quickbasket

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickbasket}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  sql:
    init:
      mode: always
      defer-datasource-initialization: true

quickcommerce:
  api:
    base-url: ${QUICKCOMMERCE_API_BASE_URL:https://quickcommerceapi.com}
    key: ${QUICKCOMMERCE_API_KEY:mock-local-key}
    active-provider: ${ACTIVE_PROVIDER:mock}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
